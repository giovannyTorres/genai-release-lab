[project]
name = "genai-release-lab"
version = "1.0.0"
description = "Source-backed synthetic GenAI release evaluation workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.8", "psycopg[binary]==3.3.8",
 "pydantic==2.14.2", "httpx==0.28.1", "openai==3.45.0", "google-genai==2.34.0",
 "alembic==1.20.1", "opentelemetry-sdk==1.45.2", "opentelemetry-instrumentation-fastapi==0.66b2"
]
[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.3.0", "ruff==0.17.3"]
[project.scripts]
release-lab = "release_lab.cli:main"
[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/api/release_lab"]
[tool.pytest.ini_options]
pythonpath = ["services/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: optional billable external API smoke, only explicit opt-in"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
